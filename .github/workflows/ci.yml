name: Build, test and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore FaultSweep.slnx
      - run: dotnet build FaultSweep.slnx -c Release --no-restore -m:1
      - run: dotnet test FaultSweep.slnx -c Release --no-build --no-restore -m:1 --logger trx --results-directory artifacts/test-results
      - run: dotnet run --project samples/FaultSweep.Demo -c Release --no-build
      - run: dotnet pack FaultSweep.slnx -c Release --no-build --no-restore -o artifacts/packages
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: packages-and-test-results
          path: artifacts/
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(dotnet msbuild src/FaultSweep/FaultSweep.csproj -getProperty:Version)
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Publish NuGet packages
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: bash
        run: |
          test -n "${NUGET_API_KEY}" || { echo 'Configure the NUGET_API_KEY repository secret before publishing.'; exit 1; }
          dotnet nuget push 'artifacts/packages/*.nupkg' --api-key "${NUGET_API_KEY}" --source https://api.nuget.org/v3/index.json --skip-duplicate
